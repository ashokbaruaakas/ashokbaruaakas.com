[www]
; Answers "pong" on /ping so the container healthcheck can probe FPM itself
; (via cgi-fcgi) instead of only checking that the php binary exists.
ping.path = /ping
ping.response = pong

; nginx already logs every request, and FPM's own access log would also record
; a /ping line per healthcheck, so keep it out of the container log.
access.log = /dev/null
