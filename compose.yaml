x-app-environment: &app_environment
    APP_NAME: '${APP_NAME}'
    APP_ENV: '${APP_ENV:-production}'
    APP_KEY: '${APP_KEY}'
    APP_DEBUG: '${APP_DEBUG:-false}'
    APP_URL: '${APP_URL}'
    APP_TIMEZONE: '${APP_TIMEZONE:-UTC}'
    APP_MAINTENANCE_DRIVER: '${APP_MAINTENANCE_DRIVER:-cache}'
    LOG_CHANNEL: '${LOG_CHANNEL:-daily}'
    DB_CONNECTION: '${DB_CONNECTION:-mysql}'
    DB_HOST: '${DB_HOST}'
    DB_PORT: '${DB_PORT:-3306}'
    DB_DATABASE: '${DB_DATABASE}'
    DB_USERNAME: '${DB_USERNAME}'
    DB_PASSWORD: '${DB_PASSWORD}'
    CACHE_STORE: '${CACHE_STORE:-redis}'
    SESSION_DRIVER: '${SESSION_DRIVER:-redis}'
    QUEUE_CONNECTION: '${QUEUE_CONNECTION:-redis}'
    REDIS_CLIENT: '${REDIS_CLIENT:-phpredis}'
    REDIS_HOST: '${REDIS_HOST}'
    REDIS_PORT: '${REDIS_PORT:-6379}'
    REDIS_PASSWORD: '${REDIS_PASSWORD:-null}'
    REDIS_QUEUE: '${REDIS_QUEUE:-default}'
    MAIL_MAILER: '${MAIL_MAILER:-log}'
    MAIL_SCHEME: '${MAIL_SCHEME}'
    MAIL_HOST: '${MAIL_HOST:-127.0.0.1}'
    MAIL_PORT: '${MAIL_PORT:-2525}'
    MAIL_USERNAME: '${MAIL_USERNAME}'
    MAIL_PASSWORD: '${MAIL_PASSWORD}'
    MAIL_FROM_ADDRESS: '${MAIL_FROM_ADDRESS:-info@yourdomain.com}'
    MAIL_FROM_NAME: '${MAIL_FROM_NAME:-${APP_NAME}}'

x-logging: &default_logging
    driver: json-file
    options:
        max-size: '10m'
        max-file: '5'

x-app-service: &app_service
    build:
        context: .
        dockerfile: Dockerfile
        target: app_runtime
    image: ${PROJECT_PREFIX}-app:latest
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default_logging

x-app-healthcheck: &app_healthcheck
    test:
        [
            'CMD-SHELL',
            'SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong',
        ]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 20s

x-web-service: &web_service
    build:
        context: .
        dockerfile: Dockerfile
        target: web_runtime
    image: ${PROJECT_PREFIX}-web:latest
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default_logging
    volumes:
        - 'uploads:/var/www/public/storage'
    healthcheck:
        test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/up']
        interval: 15s
        timeout: 5s
        retries: 3
        start_period: 20s

x-ssr-service: &ssr_service
    build:
        context: .
        dockerfile: Dockerfile
        target: ssr_runtime
    image: ${PROJECT_PREFIX}-ssr:latest
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default_logging
    environment:
        NODE_ENV: production
        PORT: 13714
    healthcheck:
        test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:13714/health']
        interval: 15s
        timeout: 5s
        retries: 3
        start_period: 20s

services:
    app_blue:
        <<: *app_service
        container_name: ${PROJECT_PREFIX}-app-blue
        environment:
            <<: *app_environment
            SSR_URL: 'http://ssr_blue:13714'
            INERTIA_SSR_URL: 'http://ssr_blue:13714'
        volumes:
            - 'storage:/var/www/storage'
            - 'uploads:/var/www/storage/app/public'
        healthcheck: *app_healthcheck

    app_green:
        <<: *app_service
        container_name: ${PROJECT_PREFIX}-app-green
        environment:
            <<: *app_environment
            SSR_URL: 'http://ssr_green:13714'
            INERTIA_SSR_URL: 'http://ssr_green:13714'
        volumes:
            - 'storage:/var/www/storage'
            - 'uploads:/var/www/storage/app/public'
        healthcheck: *app_healthcheck

    queue:
        <<: *app_service
        container_name: ${PROJECT_PREFIX}-queue
        # Longer than the worker's --timeout so an in-flight job can finish
        # before the container is replaced on deploy.
        stop_grace_period: 130s
        environment:
            <<: *app_environment
            SSR_URL: '${ACTIVE_SSR_URL:-http://ssr_blue:13714}'
            INERTIA_SSR_URL: '${ACTIVE_SSR_URL:-http://ssr_blue:13714}'
        volumes:
            - 'storage:/var/www/storage'
            - 'uploads:/var/www/storage/app/public'
        command: >-
            php artisan queue:work --queue=${REDIS_QUEUE:-default} --tries=3 --timeout=120 --backoff=1,5,10 --sleep=1 --no-interaction

    scheduler:
        <<: *app_service
        container_name: ${PROJECT_PREFIX}-scheduler
        environment:
            <<: *app_environment
            SSR_URL: '${ACTIVE_SSR_URL:-http://ssr_blue:13714}'
            INERTIA_SSR_URL: '${ACTIVE_SSR_URL:-http://ssr_blue:13714}'
        volumes:
            - 'storage:/var/www/storage'
            - 'uploads:/var/www/storage/app/public'
        command: >-
            php artisan schedule:work --no-interaction

    web_blue:
        <<: *web_service
        container_name: ${PROJECT_PREFIX}-web-blue
        depends_on:
            app_blue:
                condition: service_healthy
        environment:
            APP_UPSTREAM: app_blue

    web_green:
        <<: *web_service
        container_name: ${PROJECT_PREFIX}-web-green
        depends_on:
            app_green:
                condition: service_healthy
        environment:
            APP_UPSTREAM: app_green

    ssr_blue:
        <<: *ssr_service
        container_name: ${PROJECT_PREFIX}-ssr-blue

    ssr_green:
        <<: *ssr_service
        container_name: ${PROJECT_PREFIX}-ssr-green

volumes:
    storage:
        name: '${PROJECT_PREFIX}-storage'
    uploads:
        name: '${PROJECT_PREFIX}-uploads'
