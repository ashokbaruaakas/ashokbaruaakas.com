  <image x="772" y="60" width="426" height="426" clip-path="url(#portraitClip)" xlink:href="images/ashok-barua-portrait-640.webp" />
  <rect x="70" y="68" width="56" height="56" rx="16" fill="#10b981" fill-opacity=".16" stroke="#34d399" stroke-opacity=".55" />
  <text x="98" y="105" fill="#6ee7b7" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">AB</text>
