    <linearGradient id="portraitDisc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981" stop-opacity=".32" />
      <stop offset=".55" stop-color="#14b8a6" stop-opacity=".12" />
      <stop offset="1" stop-color="#0b1220" />
    </linearGradient>
    <clipPath id="portraitClip">
