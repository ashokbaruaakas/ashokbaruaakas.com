  </defs>
  <rect width="1200" height="630" fill="url(#background)" />
  <circle cx="1040" cy="110" r="330" fill="url(#glow)" />
  <circle cx="1100" cy="560" r="260" fill="url(#glow)" />
  <circle cx="985" cy="315" r="182" fill="none" stroke="#34d399" stroke-opacity=".25" stroke-dasharray="4 6" />
