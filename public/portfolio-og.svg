  <text x="70" y="438" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="25">7+ years · Payment systems · Laravel, Vue &amp; TypeScript</text>
  <line x1="70" y1="510" x2="1130" y2="510" stroke="#94a3b8" stroke-opacity=".22" />
